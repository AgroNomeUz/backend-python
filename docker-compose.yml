version: '5.0.2'

services:
  web:
    build: .
    command: python /code/manage.py runserver 0.0.0.0:8080
    volumes:
      - .:/code
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
        - db
  db:
    platform: linux/x86_64
    image: postgis/postgis:16-3.5
    volumes:
      - postgres_data:/var/lib/postgresql/data
#    ports:
#      - "5432:5432"
    environment:
      "POSTGRES_HOST_AUTH_METHOD": "trust"

volumes:
    postgres_data:
    postgres_legacy: